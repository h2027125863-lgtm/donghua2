<!doctype html>
<html lang="zh-CN" style="background:transparent">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6号楼火灾逃生示意动画</title>
<style>
body{margin:0;padding:16px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:transparent;color:#222;display:flex;justify-content:center}
.wrap{width:100%;max-width:760px}
.stage{position:relative;border-radius:12px;overflow:hidden}
svg{display:block;width:100%}
#big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;padding:14px 28px;border-radius:999px;border:none;background:#fff;color:#222;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35)}
#cap{font-size:16px;margin:12px 0 8px;min-height:24px}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{font-size:13px;padding:4px 10px;border-radius:8px;border:1px solid #bbb;background:#fff;color:#555;cursor:pointer}
.chip.on{background:#dbe8fb;color:#0c447c;border-color:#85b7eb}
.ctl{display:flex;align-items:center;gap:12px}
.ctl button{font-size:14px;padding:6px 16px;border-radius:8px;border:1px solid #888;background:#fff;cursor:pointer}
.ctl input{flex:1}
.note{font-size:12px;color:#777;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<div class="stage">
<svg id="scene" viewBox="0 0 680 400">
<defs><clipPath id="bclip"><rect x="180" y="60" width="240" height="280"/></clipPath></defs>
<rect x="0" y="0" width="680" height="400" fill="#0f1b33"/>
<circle cx="600" cy="70" r="16" fill="#e6e2c8"/>
<circle cx="60" cy="90" r="1.5" fill="#cdd5e6"/><circle cx="120" cy="50" r="1.5" fill="#cdd5e6"/><circle cx="500" cy="40" r="1.5" fill="#cdd5e6"/><circle cx="540" cy="120" r="1.5" fill="#cdd5e6"/><circle cx="90" cy="160" r="1.5" fill="#cdd5e6"/><circle cx="470" cy="90" r="1.5" fill="#cdd5e6"/>
<rect x="0" y="340" width="680" height="60" fill="#232c40"/>
<rect x="0" y="340" width="680" height="3" fill="#3a4560"/>
<rect x="180" y="60" width="240" height="280" fill="#3a4560" stroke="#55627f" stroke-width="1"/>
<rect x="358" y="60" width="62" height="280" fill="#2f394f"/>
<line x1="358" y1="60" x2="358" y2="340" stroke="#55627f" stroke-width="1"/>
<g stroke="#55627f" stroke-width="1"><line x1="180" y1="116" x2="420" y2="116"/><line x1="180" y1="172" x2="420" y2="172"/><line x1="180" y1="228" x2="420" y2="228"/><line x1="180" y1="284" x2="420" y2="284"/></g>
<g id="wins"></g>
<polyline points="375,60 408,88 375,116 408,144 375,172 408,200 375,228 408,256 375,284 408,312 375,340" fill="none" stroke="#8892aa" stroke-width="2" stroke-linejoin="round"/>
<g fill="#8b7355"><rect x="356" y="200" width="4" height="28"/><rect x="356" y="256" width="4" height="28"/><rect x="356" y="312" width="4" height="28"/><rect x="416" y="310" width="6" height="30"/></g>
<rect x="214" y="216" width="54" height="12" rx="2" fill="#5b6b8f"/>
<rect x="210" y="204" width="5" height="24" fill="#4a5878"/>
<g id="smoke" clip-path="url(#bclip)"></g>
<g id="fire"></g>
<g id="lying"><circle cx="224" cy="212" r="6" fill="#f1c9a5"/><rect x="230" y="208" width="36" height="9" rx="4" fill="#cfd6e6"/></g>
<rect x="234" y="209" width="34" height="9" rx="4" fill="#7b8cb8"/>
<text id="zzz" x="236" y="196" font-size="12" fill="#cdd5e6">Z z z</text>
<g id="runner">
<path id="legs" fill="none" stroke="#cfd6e6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path id="torso" fill="none" stroke="#cfd6e6" stroke-width="4" stroke-linecap="round"/>
<path id="arms" fill="none" stroke="#cfd6e6" stroke-width="3" stroke-linecap="round"/>
<circle id="head" r="6" fill="#f1c9a5"/>
<rect id="cloth" width="9" height="4" rx="1" fill="#ffffff"/>
</g>
<text id="cough" font-size="12" fill="#f2d98a">咳咳</text>
<text id="excl" x="254" y="184" font-size="22" font-weight="500" fill="#ff7a59">!</text>
<g id="amb">
<rect x="0" y="-34" width="72" height="28" rx="4" fill="#f1f3f7"/>
<rect x="0" y="-26" width="22" height="20" rx="3" fill="#dfe4ee"/>
<rect x="3" y="-23" width="14" height="8" fill="#6f8fc4"/>
<rect x="47" y="-27" width="6" height="14" fill="#d94a4a"/><rect x="43" y="-23" width="14" height="6" fill="#d94a4a"/>
<rect id="bar" x="26" y="-38" width="14" height="4" fill="#d94a4a"/>
<circle cx="14" cy="-6" r="7" fill="#1c2233" stroke="#8892aa"/><circle cx="56" cy="-6" r="7" fill="#1c2233" stroke="#8892aa"/>
</g>
<text id="tohosp" x="576" y="290" font-size="13" fill="#cdd5e6">送往医院</text>
<text x="300" y="46" text-anchor="middle" font-size="14" font-weight="500" fill="#cdd5e6">明尚西苑 6号楼</text>
<text x="24" y="38" font-size="20" font-weight="500" fill="#cdd5e6">约 04:30</text>
<text x="656" y="384" text-anchor="end" font-size="12" fill="#8892aa">示意图</text>
</svg>
<button id="big">▶ 点击播放</button>
</div>
<p id="cap"></p>
<div id="chips"></div>
<div class="ctl">
<button id="pp">播放</button>
<input type="range" id="sl" min="0" max="19" step="0.01" value="0">
</div>
<p class="note">示意动画：楼层、房间布局、起火位置、救护车等均为示意，并非事发现场真实情况。</p>
</div>
<script>
var $=function(i){return document.getElementById(i)};
var NS='http://www.w3.org/2000/svg';
function mk(tag,at,parent){var e=document.createElementNS(NS,tag);for(var k in at)e.setAttribute(k,at[k]);parent.appendChild(e);return e}
function cl(v){return Math.max(0,Math.min(1,v))}
var TEND=19;
var steps=[
{t:0,l:'凌晨约4:30',c:'凌晨约 4:30，6号楼一片安静，居民刘英（化名）正在睡觉'},
{t:2,l:'起火冒烟',c:'楼内起火，浓烟顺着楼梯井一层层往上蔓延'},
{t:4.4,l:'被烟呛醒',c:'刘英被烟呛醒，不停咳嗽'},
{t:5.6,l:'发现火光浓烟',c:'她发现有火光和浓烟'},
{t:7,l:'捂住口鼻',c:'她立刻捂住口鼻，起身往外走'},
{t:8,l:'沿楼梯下跑',c:'捂着口鼻沿楼梯往下跑，穿过浓烟'},
{t:12.7,l:'跑出楼外',c:'跑出楼外，来到空地上'},
{t:14.6,l:'后续就医',c:'随后前往医院就医'}];
var wins=$('wins');
for(var f=1;f<=5;f++){var ty=340-56*f;[268,312].forEach(function(x){var r=mk('rect',{x:x,y:ty+14,width:30,height:22,fill:'#1b2540',stroke:'#55627f'},wins);r.setAttribute('data-f',f)})}
var winEls=wins.querySelectorAll('rect');
var seed=7;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
var puffs=[];
for(var f=1;f<=5;f++){var ty=340-56*f;
for(var i=0;i<7;i++)puffs.push({f:f,x:195+rnd()*150,y:ty+12+rnd()*22,r:14+rnd()*10,p:rnd()*6});
for(var i=0;i<5;i++)puffs.push({f:f,x:368+rnd()*44,y:ty+10+rnd()*40,r:12+rnd()*8,p:rnd()*6})}
var sm=$('smoke');puffs.forEach(function(p){p.e=mk('circle',{fill:'#a7adb8',opacity:0},sm)});
var fire=$('fire');var fx=[210,245,285,320];
var fl=fx.map(function(){return{o:mk('path',{fill:'#e8602c'},fire),i:mk('path',{fill:'#f6c344'},fire)}});
var fh=[34,48,40,30];
var P=[[240,228],[375,228],[408,256],[375,284],[408,312],[375,340],[440,340],[520,340]];
var segs=[],L=0;for(var i=1;i<P.length;i++){var d=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);segs.push(d);L+=d}
function along(s){s=Math.max(0,Math.min(L,s));for(var i=0;i<segs.length;i++){if(s<=segs[i]){var k=s/segs[i];return[P[i][0]+(P[i+1][0]-P[i][0])*k,P[i][1]+(P[i+1][1]-P[i][1])*k]}s-=segs[i]}return P[P.length-1]}
function person(x,y,pose,ph,cover,op){
var sw=pose=='run'?Math.sin(ph)*8:0;
var legs,torso,arms,hx,hy,cy;
if(pose=='sit'){hx=x;hy=y-30;legs='M'+x+' '+(y-12)+' L'+(x+14)+' '+(y-12)+' L'+(x+14)+' '+y;torso='M'+x+' '+(y-24)+' L'+x+' '+(y-12);
arms=cover?'M'+x+' '+(y-21)+' L'+(x+5)+' '+(y-28):'M'+x+' '+(y-21)+' L'+(x+8)+' '+(y-15);cy=y-29}
else{hx=x;hy=y-36;legs='M'+x+' '+(y-15)+' L'+(x+sw)+' '+y+' M'+x+' '+(y-15)+' L'+(x-sw)+' '+y;torso='M'+x+' '+(y-30)+' L'+x+' '+(y-15);
arms=cover?'M'+x+' '+(y-27)+' L'+(x+5)+' '+(y-33)+' M'+x+' '+(y-27)+' L'+(x+7)+' '+(y-31):'M'+x+' '+(y-27)+' L'+(x+sw*0.8)+' '+(y-17)+' M'+x+' '+(y-27)+' L'+(x-sw*0.8)+' '+(y-17);cy=y-35}
$('legs').setAttribute('d',legs);$('torso').setAttribute('d',torso);$('arms').setAttribute('d',arms);
$('head').setAttribute('cx',hx);$('head').setAttribute('cy',hy);
var c=$('cloth');c.setAttribute('x',x-1);c.setAttribute('y',cy);c.setAttribute('opacity',cover?1:0);
$('runner').setAttribute('opacity',op);
var co=$('cough');co.setAttribute('x',x+10);co.setAttribute('y',hy-10)}
function render(t){
for(var i=0;i<fl.length;i++){var g=cl((t-2)/1.5);var h=fh[i]*g*(1+0.15*Math.sin(t*14+i*2));var x=fx[i];
fl[i].o.setAttribute('d','M'+(x-14)+' 340 Q'+(x-16)+' '+(340-h*0.5)+' '+x+' '+(340-h)+' Q'+(x+16)+' '+(340-h*0.5)+' '+(x+14)+' 340 Z');
fl[i].i.setAttribute('d','M'+(x-7)+' 340 Q'+(x-8)+' '+(340-h*0.3)+' '+x+' '+(340-h*0.6)+' Q'+(x+8)+' '+(340-h*0.3)+' '+(x+7)+' 340 Z')}
puffs.forEach(function(p){var ts=2.2+(p.f-1)*0.9;var d=cl((t-ts)/1.2);
p.e.setAttribute('cx',p.x+Math.sin(t*1.3+p.p)*4);p.e.setAttribute('cy',p.y-Math.sin(t*0.9+p.p)*3);
p.e.setAttribute('r',p.r*(0.6+0.4*d));p.e.setAttribute('opacity',0.5*d*(0.85+0.15*Math.sin(t*2+p.p)))});
winEls.forEach(function(w){var f=+w.getAttribute('data-f');var fill='#1b2540';
if(f==1&&t>2.2)fill='#e8602c';if(f==3&&t>=4.4)fill='#f2d98a';w.setAttribute('fill',fill)});
var lying=t<4.4;$('lying').setAttribute('opacity',lying?1:0);
$('zzz').setAttribute('opacity',t<2?(0.5+0.5*Math.sin(t*3)):0);
$('excl').setAttribute('opacity',(t>=5.6&&t<7)?1:0);
var cough=false,pos=[240,228],pose='stand',ph=0,cover=false,op=1;
if(lying){op=0}
else if(t<7){pose='sit';cough=true}
else if(t<8){pose='stand';cover=true;cough=true}
else{pose='run';var s=cl((t-8)/6)*L;pos=along(s);ph=t*9;cover=t<12.7;cough=t<12.7;if(t>=14)pose='stand';
if(t>=17.2){var k=cl((t-17.2)/0.9);pos=[520+25*k,340];pose='run';ph=t*9;op=1-cl((t-18)/0.8)}}
person(pos[0],pos[1],pose,ph,cover,op);
$('cough').setAttribute('opacity',(cough&&Math.sin(t*6)>-0.3)?1:0);
var ax=720-172*(1-Math.pow(1-cl((t-14.6)/2.4),2));
$('amb').setAttribute('transform','translate('+ax+',340)');
$('bar').setAttribute('fill',(t>14.6&&Math.sin(t*10)>0)?'#d94a4a':'#4a7bd9');
$('tohosp').setAttribute('opacity',cl((t-17)/0.8));
var cur=0;steps.forEach(function(s,i){if(t>=s.t)cur=i});
$('cap').textContent=steps[cur].c;
chipEls.forEach(function(c,i){c.className='chip'+(i==cur?' on':'')})}
var t=0,playing=false,last=null;
var chipEls=steps.map(function(s){var b=document.createElement('button');b.textContent=s.l;b.className='chip';
b.onclick=function(){t=s.t+0.01;play()};$('chips').appendChild(b);return b});
function upd(){$('pp').textContent=playing?'暂停':(t>=TEND?'重播':(t>0?'继续':'播放'));$('big').style.display=(playing||t>0)?'none':'block'}
function play(){if(t>=TEND)t=0;playing=true;last=null;upd()}
function pause(){playing=false;last=null;upd()}
$('big').onclick=play;
$('pp').onclick=function(){if(playing)pause();else play()};
$('sl').oninput=function(){t=+this.value;pause()};
function frame(ts){if(playing){if(last!=null)t+=Math.min(0.1,(ts-last)/1000);if(t>=TEND){t=TEND;playing=false;upd()}}
last=ts;render(t);$('sl').value=t;requestAnimationFrame(frame)}
upd();requestAnimationFrame(frame);
</script>
</body>
</html>
